name: Build CHIZI sing-box ARM64 (tc-rewrite)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "CHIZI branch / tag / commit"
        required: true
        default: "testing-ebpf-tc-rewrite"
        type: string

permissions:
  contents: write

concurrency:
  group: chizi-sing-box-build-tc-rewrite
  cancel-in-progress: true

env:
  SOURCE_REPO: CHIZI-0618/sing-box
  SOURCE_BRANCH: testing-ebpf-tc-rewrite
  BUILD_TAGS: with_ebpf,with_quic,with_utls,with_clash_api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 确定源码分支 / Tag / Commit
      # ============================================================
      - name: Resolve source ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF="${{ inputs.source_ref }}"
          else
            REF="${SOURCE_BRANCH}"
          fi

          echo "value=${REF}" >> "$GITHUB_OUTPUT"
          echo "Source ref: ${REF}"

      # ============================================================
      # 2. Checkout CHIZI
      #
      # fetch-depth: 0 用于获取完整 tags
      # ============================================================
      - name: Checkout CHIZI
        uses: actions/checkout@v5
        with:
          repository: CHIZI-0618/sing-box
          ref: ${{ steps.ref.outputs.value }}
          path: source
          fetch-depth: 0
          fetch-tags: true

      # ============================================================
      # 3. 读取版本和源码信息
      # ============================================================
      - name: Read build metadata
        id: meta
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"

          BASE_TAG="$(
            git for-each-ref \
              --sort=-version:refname \
              --count=1 \
              --format='%(refname:short)' \
              'refs/tags/v*'
          )"

          if [[ -z "${BASE_TAG}" ]]; then
            echo "ERROR: no sing-box version tag found"
            exit 1
          fi

          BASE_VERSION="${BASE_TAG#v}"
          VERSION="${BASE_VERSION}-chizi-tcrewrite.${SHORT_SHA}"
          RELEASE_TAG="chizi-tcrewrite-${BASE_VERSION}-${SHORT_SHA}"

          COMMIT_DATE="$(git show -s --format=%cI HEAD)"
          COMMIT_SUBJECT="$(git show -s --format=%s HEAD)"

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_date=${COMMIT_DATE}" >> "$GITHUB_OUTPUT"

          {
            echo "commit_subject<<EOF"
            echo "${COMMIT_SUBJECT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Source       : ${SOURCE_REPO}"
          echo "Ref          : ${{ steps.ref.outputs.value }}"
          echo "Commit       : ${SHA}"
          echo "Base tag     : ${BASE_TAG}"
          echo "Build version: ${VERSION}"
          echo "Release tag  : ${RELEASE_TAG}"
          echo "========================================"

      # ============================================================
      # 4. 检查当前版本是否已经发布
      # ============================================================
      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.release_tag }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Already built: ${TAG}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New build: ${TAG}"
          fi

      # ============================================================
      # 5. Go
      # ============================================================
      - name: Setup Go
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      # ============================================================
      # 6. 验证 eBPF object + 运行相关测试
      #
      # tc-rewrite 分支把 cilium 分支的 cgroup.bpf.c / shared_network.bpf.c
      # 合并成了统一的 tc.bpf.c，产物文件名也随之变成 tc_bpfel.o /
      # tc_bpfeb.o，不再有 cgroup_*.o / shared_network_*.o / splice_*.o。
      # 已对照该分支 common/ebpf/internal/bpfgen/ 目录实际内容确认。
      # ============================================================
      - name: Verify and test eBPF
        if: steps.release.outputs.exists != 'true'
        working-directory: source
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          test -f common/ebpf/internal/bpfgen/tc_bpfel.o
          test -f common/ebpf/internal/bpfgen/tc_bpfeb.o
          test -f common/ebpf/internal/bpfgen/manifest.txt

          go test \
            -count=1 \
            -tags "with_ebpf" \
            ./common/ebpf \
            ./protocol/ebpf \
            ./include \
            ./option

      # ============================================================
      # 7. 编译 Linux ARM64
      # ============================================================
      - name: Build Linux ARM64
        if: steps.release.outputs.exists != 'true'
        working-directory: source
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          mkdir -p dist

          VERSION="${{ steps.meta.outputs.version }}"
          SHARED_LDFLAGS="$(tr -d '\n' < release/LDFLAGS)"

          echo "========================================"
          echo "Target : ${GOOS}/${GOARCH}"
          echo "CGO    : ${CGO_ENABLED}"
          echo "Tags   : ${BUILD_TAGS}"
          echo "Version: ${VERSION}"
          echo "========================================"

          go build \
            -trimpath \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} ${SHARED_LDFLAGS} -s -w -buildid=" \
            -o dist/sing-box-linux-arm64 \
            ./cmd/sing-box

      # ============================================================
      # 8. 验证 ARM64 二进制并生成 checksum
      # ============================================================
      - name: Validate binary
        if: steps.release.outputs.exists != 'true'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          BIN="dist/sing-box-linux-arm64"

          test -s "${BIN}"

          FILE_INFO="$(file "${BIN}")"

          echo "${FILE_INFO}"

          if ! grep -Eqi 'ARM aarch64|ARM64|aarch64' <<< "${FILE_INFO}"; then
            echo "ERROR: binary is not ARM64"
            exit 1
          fi

          if grep -qi "dynamically linked" <<< "${FILE_INFO}"; then
            echo "ERROR: binary is dynamically linked"
            exit 1
          fi

          sha256sum "${BIN}" > dist/sing-box-linux-arm64.sha256

          echo
          ls -lh "${BIN}"
          cat dist/sing-box-linux-arm64.sha256

      # ============================================================
      # 9. build-info
      # ============================================================
      - name: Create build info
        if: steps.release.outputs.exists != 'true'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          cat > dist/build-info.txt <<EOF
          Repository: ${SOURCE_REPO}
          Ref: ${{ steps.ref.outputs.value }}
          Commit: ${{ steps.meta.outputs.sha }}
          Commit date: ${{ steps.meta.outputs.commit_date }}
          Commit subject: ${{ steps.meta.outputs.commit_subject }}
          Base tag: ${{ steps.meta.outputs.base_tag }}
          Base version: ${{ steps.meta.outputs.base_version }}
          Build version: ${{ steps.meta.outputs.version }}
          Target: linux/arm64
          CGO_ENABLED: 0
          Build tags: ${BUILD_TAGS}
          EOF

          cat dist/build-info.txt

      # ============================================================
      # 10. 发布 Release
      # ============================================================
      - name: Publish release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.release_tag }}"
          VERSION="${{ steps.meta.outputs.version }}"

          cat > /tmp/release-notes.md <<EOF
          ## CHIZI sing-box ARM64 (testing-ebpf-tc-rewrite)

          - Version: \`${VERSION}\`
          - Source: \`${SOURCE_REPO}\`
          - Ref: \`${{ steps.ref.outputs.value }}\`
          - Commit: \`${{ steps.meta.outputs.sha }}\`
          - Commit date: \`${{ steps.meta.outputs.commit_date }}\`
          - Commit subject: ${{ steps.meta.outputs.commit_subject }}
          - Target: \`linux/arm64\`
          - CGO: \`disabled\`
          - Build tags: \`${BUILD_TAGS}\`
          EOF

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file /tmp/release-notes.md \
            source/dist/sing-box-linux-arm64 \
            source/dist/sing-box-linux-arm64.sha256 \
            source/dist/build-info.txt
